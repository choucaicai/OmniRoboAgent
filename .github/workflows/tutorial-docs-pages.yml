name: Deploy tutorial docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "tutorial_docs/**"
      - ".github/workflows/tutorial-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload tutorial docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: tutorial_docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
