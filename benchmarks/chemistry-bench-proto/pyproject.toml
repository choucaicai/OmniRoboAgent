[project]
name = "chemistry-bench-proto"
version = "0.1.0"
description = "gRPC contract for execution backends (sim_worker / real_worker)"
requires-python = ">=3.10"
dependencies = ["grpcio==1.83.0", "protobuf==7.35.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemistry_bench_proto"]
