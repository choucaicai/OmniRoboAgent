agent:
  class_path: omniroboagent.agent_core.DefaultAgent

planner:
  class_path: omniroboagent.agent_core.SubtaskSkillPlanner
  init_args:
    backend:
      class_path: omniroboagent.backends.llm.OpenAICompatibleLLMBackend
      init_args:
        base_url: http://127.0.0.1:8000
        model: Qwen3.5-9B
        timeout_seconds: 120
        max_retries: 2
    skill_ids:
      Close_Door: 1
      Open_Door: 2
      Close_Lid: 3
      Open_Lid: 4
      Insertion: 5
      Navigation: 6
      Pick_Place: 7
      Press_Button: 8
      Slide_Rack: 9
      Turn_Lever: 10
      Twist_Knob: 11
    skill_definitions:
      Close_Door: Close a cabinet, fridge, microwave, oven, dishwasher, or toaster-oven door.
      Open_Door: Open a cabinet, fridge, microwave, oven, dishwasher, or toaster-oven door.
      Close_Lid: Close a lid, cover, cap, or mixer head.
      Open_Lid: Open a lid, cover, cap, or mixer head.
      Insertion: Insert an object or tool into another object, appliance, or fixture.
      Navigation: Move the robot base or whole body to a target region.
      Pick_Place: Pick, locally move, and place or release an object.
      Press_Button: Press and release an appliance button.
      Slide_Rack: Slide a rack, drawer-like fixture, dishwasher rack, oven rack, or fridge drawer.
      Turn_Lever: Move a lever, handle, faucet control, or spout.
      Twist_Knob: Rotate a knob or dial to a target setting.
    camera_keys:
      - video.robot0_agentview_left
      - video.robot0_agentview_right
      - video.robot0_eye_in_hand
    history_limit: 10
    max_tokens: 1024
    temperature: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

skill_backend:
  name: local
  init_args:
    policy:
      class_path: omniroboagent.backends.skills.GR00TLocalPolicyAdapter
      init_args:
        policy_class_path: gr00t.model_moe_v1.policy.Gr00tPolicy
        data_config: panda_omron
        embodiment_tag: new_embodiment
        denoising_steps: 4
        device: cuda:0
        memory_queue_size: 0
    entrypoint: predict

verifier:
  class_path: omniroboagent.agent_core.SubtaskVerifier
  init_args:
    backend:
      class_path: omniroboagent.backends.llm.OpenAICompatibleLLMBackend
      init_args:
        base_url: http://127.0.0.1:8000
        model: Qwen3.5-9B
        timeout_seconds: 120
        max_retries: 2
    camera_keys:
      - video.robot0_agentview_left
      - video.robot0_agentview_right
      - video.robot0_eye_in_hand
    check_interval_chunks: 8
    max_tokens: 512
    temperature: 0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

memory:
  class_path: omniroboagent.agent_core.TieredMemory
  init_args:
    visual_window_size: 4
    recent_event_limit: 20
    key_event_limit: 20
    summary_max_chars: 4096
    save_key_event_artifacts: true
    camera_keys:
      - video.robot0_agentview_left
      - video.robot0_agentview_right
      - video.robot0_eye_in_hand
