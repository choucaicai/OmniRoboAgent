agent:
  class_path: omniroboagent.agent_core.DefaultAgent
task_decomposer:
  class_path: omniroboagent.agent_core.TaskDecomposer
  init_args:
    backend:
      class_path: omniroboagent.backends.llm.OpenAICompatibleLLMBackend
      init_args:
        base_url: https://shuliuyun.com/v1
        model: gpt-5.6-sol
        timeout_seconds: 600
        max_retries: 2
    camera_keys:
    - video.robot0_agentview_left
    - video.robot0_agentview_right
    - video.robot0_eye_in_hand
    max_images: 3
    max_nodes: 32
    max_tokens: 3072
    temperature: 0
    response_format_mode: json_object
    prompt_skill:
      class_path: omniroboagent.agent_core.AdaptivePromptSkill
      init_args:
        history_limit: 10
        default_task_shape: composite
        audit_history_limit: 64
    recovery_max_frames: 4
    recovery_images_per_frame: 3
planner:
  class_path: omniroboagent.agent_core.StateGroundedSubtaskPlanner
  init_args:
    backend:
