        default_task_shape: composite
        audit_history_limit: 64
skill_backend:
  name: xiaomi_remote
  init_args:
    host: 127.0.0.1
    ports:
    - 19301
    - 19302
    - 19303
    - 19304
    - 19305
    - 19306
    - 19307
    - 19308
    - 19309
    timeout_seconds: 900
    worker_index_env: ROBOCASA_WORKER_INDEX
    observation_history: 4
    observation_interval: 2
    instruction_mode: task_graph
verifier:
  class_path: omniroboagent.agent_core.SubtaskVerifier
  init_args:
    backend:
      class_path: omniroboagent.backends.llm.OpenAICompatibleLLMBackend
      init_args:
        base_url: https://shuliuyun.com/v1
        model: gpt-5.6-sol
        timeout_seconds: 600
        max_retries: 2
    camera_keys:
    - video.robot0_agentview_left
    - video.robot0_agentview_right
    - video.robot0_eye_in_hand
    check_interval_chunks: 64
    max_tokens: 2048
    temperature: 0
    max_images: 6
    response_format_mode: json_object
    prompt_skill:
      class_path: omniroboagent.agent_core.AdaptivePromptSkill
      init_args:
        history_limit: 16
        default_task_shape: composite
        audit_history_limit: 64
memory:
  class_path: omniroboagent.agent_core.LongMemory
  init_args:
    recent_event_limit: 16
    failed_event_limit: 6
    key_event_limit: 24
    summary_max_chars: 4096
    summary_async: false
