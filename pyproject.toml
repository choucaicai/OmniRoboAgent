[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniroboagent"
version = "0.1.0"
description = "Modular runtime and evaluation framework for embodied agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
chemistry_bench = [
    "grpcio==1.83.0",
    "protobuf==7.35.1",
    "chemistry-bench-proto==0.1.0",
]
openpi = [
    "openpi-client @ https://github.com/robocasa-benchmark/openpi/archive/5a6beda9ff99da30b4e1b59320f6a32971d7c397.tar.gz#subdirectory=packages/openpi-client",
]
groot-client = [
    "pyzmq>=26,<28",
    "torch>=2.4,<3",
]
eb-alfred = [
    "ai2thor==2.1.0",
    "click==8.1.7",
    "embodiedbench==0.1",
    "flask==1.1.2",
    "gym==0.23.1",
    "hydra-core==1.3.2",
    "itsdangerous==1.1.0",
    "jinja2==2.11.3",
    "markupsafe==1.1.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.10.0.84",
    "progressbar2==4.5.0",
    "requests==2.32.3",
    "revtok==0.0.3",
    "scipy==1.13.1",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "tqdm==4.67.1",
    "urllib3==1.26.20",
    "vocab==0.0.5",
    "werkzeug==1.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "types-PyYAML>=6,<7",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
chemistry-bench-proto = { path = "benchmarks/chemistry-bench-proto" }
embodiedbench = { path = "benchmarks/EmbodiedBench", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.scripts]
omniroboagent = "omniroboagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniroboagent = ["py.typed"]
"omniroboagent.environments.benchmarks.chemistry_bench" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["omniroboagent"]
